<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1a1a2e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="주식스크리너">
<title>주식 조건검색 스크리너</title>
<link rel="manifest" href="/static/manifest.json">
<link rel="apple-touch-icon" href="/static/icon.svg">
<link rel="icon" href="/static/icon.svg">
<style>
  :root {
    --bg: #f4f5f7; --card: #ffffff; --text: #1c1c1e; --sub: #6b6b70;
    --accent: #3b6fe0; --border: #e4e4e8;
    --up: #e5484d; --down: #3e7bfa; --zero: #8a8a8f;
    --header-bg: #24242b; --header-text: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121214; --card: #1c1c1f; --text: #f0f0f2; --sub: #9a9aa0;
      --accent: #6d93ff; --border: #2c2c31;
      --header-bg: #05070d; --header-text: #f0f0f2;
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Malgun Gothic", sans-serif;
    padding-bottom: 40px;
  }
  header {
    background: var(--header-bg); color: var(--header-text);
    padding: 18px 16px calc(14px + env(safe-area-inset-top)) 16px;
    padding-top: calc(18px + env(safe-area-inset-top));
    position: sticky; top: 0; z-index: 10;
    display: flex; align-items: center; gap: 10px;
  }
  header .back { display: none; font-size: 22px; cursor: pointer; padding: 4px 8px; }
  header .back.show { display: inline-block; }
  header h1 { font-size: 17px; margin: 0; font-weight: 700; flex: 1; }
  main { max-width: 640px; margin: 0 auto; padding: 14px; }

  #menu-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .menu-btn {
    background: var(--card); border: 1px solid var(--border); border-radius: 14px;
    padding: 16px 12px; text-align: left; cursor: pointer; color: var(--text);
    display: flex; flex-direction: column; gap: 4px; min-height: 78px;
  }
  .menu-btn .icon { font-size: 22px; }
  .menu-btn .label { font-size: 14.5px; font-weight: 700; }
  .menu-btn .desc { font-size: 11.5px; color: var(--sub); line-height: 1.3; }
  .menu-btn:active { transform: scale(0.97); }

  .card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 16px; margin-bottom: 12px; }
  .field { margin-bottom: 12px; }
  .field label { display: block; font-size: 13px; color: var(--sub); margin-bottom: 6px; font-weight: 600; }
  .field input, .field textarea {
    width: 100%; padding: 11px 12px; border-radius: 10px; border: 1px solid var(--border);
    background: var(--bg); color: var(--text); font-size: 15px; font-family: inherit;
  }
  .field textarea { min-height: 90px; resize: vertical; }
  .field .hint { font-size: 11.5px; color: var(--sub); margin-top: 5px; }

  .run-btn {
    width: 100%; padding: 14px; border: none; border-radius: 12px; background: var(--accent);
    color: white; font-size: 16px; font-weight: 700; cursor: pointer;
  }
  .run-btn:disabled { opacity: 0.5; }
  .save-btn {
    width: 100%; padding: 11px; border: 1px solid var(--border); border-radius: 10px;
    background: transparent; color: var(--text); font-size: 14px; font-weight: 600; cursor: pointer; margin-top: 8px;
  }

  #status { text-align: center; padding: 30px 10px; color: var(--sub); font-size: 14px; }
  .spinner {
    width: 30px; height: 30px; margin: 0 auto 12px; border-radius: 50%;
    border: 3px solid var(--border); border-top-color: var(--accent);
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .summary { font-size: 13px; color: var(--sub); margin-bottom: 10px; }
  .table-wrap { overflow-x: auto; border: 1px solid var(--border); border-radius: 12px; background: var(--card); }
  table { border-collapse: collapse; width: 100%; font-size: 13px; white-space: nowrap; }
  th, td { padding: 9px 10px; text-align: right; border-bottom: 1px solid var(--border); }
  th:first-child, td:first-child, th:nth-child(2), td:nth-child(2) { text-align: left; }
  th { background: var(--header-bg); color: var(--header-text); font-weight: 600; position: sticky; top: 0; }
  tr:last-child td { border-bottom: none; }
  .pos { color: var(--up); font-weight: 700; }
  .neg { color: var(--down); font-weight: 700; }

  .chart-card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 14px; margin-top: 12px; }
  .chart-card h3 { font-size: 14px; margin: 0 0 10px 0; }
  .chart-card canvas { max-height: 260px; }

  .error-box { background: #fdeceb; color: #b3261e; border-radius: 12px; padding: 14px; font-size: 14px; }
  @media (prefers-color-scheme: dark) { .error-box { background: #3a1f1e; color: #ff8a80; } }
</style>
</head>
<body>

<header>
  <span class="back" id="backBtn" onclick="showMenu()">‹</span>
  <h1 id="pageTitle">주식 조건검색 스크리너</h1>
</header>

<main>
  <div id="menu-grid"></div>

  <div id="form-area" style="display:none"></div>

  <div id="result-area"></div>
</main>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
<script>
const MENU = [
  { id: "watchlist", icon: "★", label: "관심종목 조회", desc: "관심종목.txt 파일 기준", needsForm: false },
  { id: "basic", icon: "📊", label: "기본 스크리닝", desc: "시총 1000억+ / 거래량 50만주+", needsForm: false },
  { id: "decline", icon: "📉", label: "낙폭과대주", desc: "최근 20일 20% 이상 하락", needsForm: false },
  { id: "uptrend", icon: "📈", label: "상승세 지속 종목", desc: "최근 20일 중 12일 이상 상승", needsForm: false },
  { id: "theme", icon: "🏷️", label: "테마주 검색", desc: "키워드 직접 입력", needsForm: true },
  { id: "single", icon: "🔎", label: "특정 종목 조회", desc: "정확한 코드/이름 + 손익표", needsForm: true },
  { id: "custom", icon: "⚙️", label: "직접 옵션 입력", desc: "고급 사용자용", needsForm: true },
  { id: "search", icon: "🔍", label: "종목 검색", desc: "이름 일부 + 손익표", needsForm: true },
  { id: "combined", icon: "🗂️", label: "통합 조회", desc: "테마 위주, 테마별 결과+관심/검색/조회", needsForm: true },
];

const grid = document.getElementById("menu-grid");
MENU.forEach(m => {
  const btn = document.createElement("div");
  btn.className = "menu-btn";
  btn.innerHTML = `<div class="icon">${m.icon}</div><div class="label">${m.label}</div><div class="desc">${m.desc}</div>`;
  btn.onclick = () => openMode(m);
  grid.appendChild(btn);
});

function showMenu() {
  document.getElementById("menu-grid").style.display = "grid";
  document.getElementById("form-area").style.display = "none";
  document.getElementById("result-area").innerHTML = "";
  document.getElementById("backBtn").classList.remove("show");
  document.getElementById("pageTitle").textContent = "주식 조건검색 스크리너";
}

let watchlistLoaded = null;

function openMode(m) {
  document.getElementById("menu-grid").style.display = "none";
  document.getElementById("backBtn").classList.add("show");
  document.getElementById("pageTitle").textContent = m.label;
  document.getElementById("result-area").innerHTML = "";
  const formArea = document.getElementById("form-area");
  formArea.style.display = "block";

  let html = '<div class="card">';

  if (m.id === "theme") {
    html += field("kw", "테마 키워드", "예: 2차전지,로봇", "text");
  } else if (m.id === "single" || m.id === "search") {
    html += m.id === "single"
      ? field("code", "종목코드 또는 종목명", "예: 006400 또는 삼성SDI", "text")
      : field("kw2", "검색할 종목명 (일부)", "예: 삼성, SK, 전자", "text");
    html += field("buy", "매입가 (선택)", "예: 400000", "number");
    html += field("qty", "매입수량 (선택)", "예: 10", "number");
  } else if (m.id === "custom") {
    html += `<div class="field"><label>옵션 직접 입력</label>
      <textarea id="opt" placeholder="예: --market-cap-min 1000 --up-days-min 10"></textarea>
      <div class="hint">--market-cap-min --volume-min --cum-decline-min --up-days-min --consecutive-up-min --period --theme-keyword --code --name --search --market 사용 가능</div></div>`;
  } else if (m.id === "watchlist") {
    html += field("wlDirect", "직접 입력 (선택, 콤마로 여러개)", "예: 006400,삼성전자 - 입력하면 아래 파일 대신 이걸 조회", "text");
    html += `<div class="field"><label>관심종목.txt (직접 입력을 안 썼을 때 사용, #뒤는 주석)</label>
      <textarea id="wl" placeholder="불러오는 중...">${''}</textarea></div>
      <button class="save-btn" onclick="saveWatchlist()">파일만 저장하기</button>`;
    html += field("buy", "매입가 (선택)", "예: 400000", "number");
    html += field("qty", "매입수량 (선택)", "예: 10", "number");
  } else if (m.id === "combined") {
    html += `<div class="hint" style="margin-bottom:10px">테마주 위주 통합 조회입니다. 필요 없는 항목은 비워두면 건너뜁니다.</div>`;
    html += field("cTheme", "[테마주] 테마 키워드 (콤마로 여러개 -> 테마별로 결과 분리)", "예: 2차전지,로봇,반도체", "text");
    html += field("cWl", "[관심종목] 직접 입력 (선택)", "예: 006400,005930", "text");
    html += field("cSearch", "[종목검색] 키워드 (선택)", "예: 삼성, SK", "text");
    html += field("cLookup", "[종목조회] 종목코드/종목명 (선택)", "예: 006400", "text");
    html += field("buy", "매입가 (선택, 테마주 제외 적용)", "예: 400000", "number");
    html += field("qty", "매입수량 (선택)", "예: 10", "number");
  }

  html += `<button class="run-btn" id="runBtn" onclick="runMode('${m.id}')">실행</button></div>`;
  formArea.innerHTML = html;

  if (m.id === "watchlist") {
    fetch("/api/watchlist").then(r => r.json()).then(d => {
      document.getElementById("wl").value = d.text;
    });
  }
}

function field(id, label, placeholder, type) {
  return `<div class="field"><label>${label}</label><input id="${id}" type="${type}" placeholder="${placeholder}"></div>`;
}

function saveWatchlist() {
  const text = document.getElementById("wl").value;
  fetch("/api/watchlist", { method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify({text}) })
    .then(() => alert("저장했습니다."));
}

function runMode(id) {
  const body = { preset: id };

  if (id === "theme") body.theme_keyword = val("kw");
  if (id === "single") { body.code = val("code"); body.name = val("code"); body.buy_price = val("buy"); body.quantity = val("qty"); }
  if (id === "search") { body.search = val("kw2"); body.buy_price = val("buy"); body.quantity = val("qty"); }
  if (id === "custom") body.custom_args = val("opt");
  if (id === "watchlist") {
    saveWatchlistSilently();
    const direct = val("wlDirect");
    if (direct) { body.code = direct; body.name = direct; }
    body.buy_price = val("buy");
    body.quantity = val("qty");
  }

  const isCombined = id === "combined";
  const url = isCombined ? "/api/run_combined" : "/api/run";
  if (isCombined) {
    body.theme_keyword = val("cTheme");
    body.wl_input = val("cWl");
    body.search_kw = val("cSearch");
    body.lookup = val("cLookup");
    body.buy_price = val("buy");
    body.quantity = val("qty");
  }

  const runBtn = document.getElementById("runBtn");
  if (runBtn) runBtn.disabled = true;

  document.getElementById("result-area").innerHTML =
    '<div id="status"><div class="spinner"></div>네이버금융에서 데이터를 불러오는 중입니다...<br>종목 수·테마 개수에 따라 몇 분 걸릴 수 있어요.</div>';

  fetch(url, { method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body) })
    .then(async r => {
      const data = await r.json();
      if (!r.ok) throw new Error(data.error || "알 수 없는 오류");
      if (isCombined) {
        renderSections(data.sections);
      } else {
        render(data);
      }
    })
    .catch(err => {
      document.getElementById("result-area").innerHTML = `<div class="error-box">${escapeHtml(err.message)}</div>`;
    })
    .finally(() => { if (runBtn) runBtn.disabled = false; });
}

function saveWatchlistSilently() {
  const el = document.getElementById("wl");
  if (!el) return;
  fetch("/api/watchlist", { method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify({text: el.value}) });
}

function val(id) {
  const el = document.getElementById(id);
  return el ? el.value.trim() : "";
}

function escapeHtml(s) {
  const d = document.createElement("div");
  d.textContent = s;
  return d.innerHTML;
}

function fmtNum(v) {
  if (v === null || v === undefined) return "";
  if (typeof v === "number") return v.toLocaleString("ko-KR", { maximumFractionDigits: 2 });
  return v;
}

function tableHtml(data) {
  let html = `<div class="summary">${data.count}개 종목</div><div class="table-wrap"><table><thead><tr>`;
  data.columns.forEach(c => html += `<th>${c}</th>`);
  html += "</tr></thead><tbody>";

  data.rows.forEach(row => {
    html += "<tr>";
    row.forEach((v, i) => {
      const col = data.columns[i];
      let cls = "";
      if (data.color_cols.includes(col) && typeof v === "number") {
        cls = v > 0 ? "pos" : (v < 0 ? "neg" : "");
      }
      let text = fmtNum(v);
      if (data.percent_cols.includes(col) && typeof v === "number") text += "%";
      html += `<td class="${cls}">${text === "" || text === null ? "" : escapeHtml(String(text))}</td>`;
    });
    html += "</tr>";
  });
  html += "</tbody></table></div>";
  return html;
}

function render(data) {
  const area = document.getElementById("result-area");
  if (data.count === 0) {
    area.innerHTML = '<div class="error-box">조건에 맞는 종목이 없습니다.</div>';
    return;
  }

  area.innerHTML = tableHtml(data);

  if (data.buy_price_mode) {
    area.innerHTML += `
      <div class="chart-card"><h3>평가금 비중</h3><canvas id="chart1"></canvas></div>
      <div class="chart-card"><h3>평가손익 (▲이익 · ▼손실)</h3><canvas id="chart2"></canvas></div>`;
    drawCharts(data, "");
  }
}

function renderSections(sections) {
  const area = document.getElementById("result-area");
  if (!sections || sections.length === 0) {
    area.innerHTML = '<div class="error-box">조건에 맞는 종목이 없습니다.</div>';
    return;
  }

  let html = "";
  sections.forEach((data, idx) => {
    const suffix = String(idx);
    html += `<div class="card" style="padding-top:12px"><div style="font-weight:800;font-size:15px;margin-bottom:8px">${escapeHtml(data.name)}</div>`;
    html += data.count === 0
      ? '<div class="hint">결과 없음</div>'
      : tableHtml(data);
    if (data.count > 0 && data.buy_price_mode) {
      html += `
        <div class="chart-card"><h3>평가금 비중</h3><canvas id="chart1_${suffix}"></canvas></div>
        <div class="chart-card"><h3>평가손익 (▲이익 · ▼손실)</h3><canvas id="chart2_${suffix}"></canvas></div>`;
    }
    html += "</div>";
  });
  area.innerHTML = html;

  sections.forEach((data, idx) => {
    if (data.count > 0 && data.buy_price_mode) drawCharts(data, String(idx));
  });
}

function drawCharts(data, suffix) {
  const nameIdx = data.columns.indexOf("종목명");
  const evalIdx = data.columns.indexOf("평가금");
  const pnlIdx = data.columns.indexOf("평가손익");
  const labels = data.rows.map(r => r[nameIdx]);
  const evalVals = data.rows.map(r => r[evalIdx]);
  const pnlVals = data.rows.map(r => r[pnlIdx]);
  const pnlColors = pnlVals.map(v => v > 0 ? "#e5484d" : (v < 0 ? "#3e7bfa" : "#bfbfbf"));

  const palette = ["#5B8FF9","#4FCE9C","#F6BD16","#E86452","#6DC8EC","#945FB9","#FF9845","#1E9493"];
  const id1 = suffix ? `chart1_${suffix}` : "chart1";
  const id2 = suffix ? `chart2_${suffix}` : "chart2";

  new Chart(document.getElementById(id1), {
    type: "pie",
    data: { labels, datasets: [{ data: evalVals, backgroundColor: palette }] },
    options: { plugins: { legend: { position: "bottom", labels: { boxWidth: 12, font: { size: 11 } } } } }
  });

  new Chart(document.getElementById(id2), {
    type: "pie",
    data: { labels, datasets: [{ data: pnlVals.map(Math.abs), backgroundColor: pnlColors }] },
    options: {
      plugins: {
        legend: { display: false },
        tooltip: { callbacks: { label: (ctx) => `${ctx.label}: ${pnlVals[ctx.dataIndex].toLocaleString("ko-KR")}원` } }
      }
    }
  });
}

if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("/static/sw.js").catch(() => {});
}
</script>
</body>
</html>
